[workspace]
name = "lumen"
channels = ["pyviz/label/dev", "bokeh", "conda-forge"]
platforms = ["linux-64", "osx-arm64", "win-64"]

[tasks]
install = 'python -m pip install --no-deps --disable-pip-version-check -e .'

[activation.env]
PYTHONIOENCODING = "utf-8"

[environments]
test-311 = ["py311", "test-core", "test", "ai", "sql", "xarray", "docx"]
test-312 = ["py312", "test-core", "test", "ai", "sql", "xarray", "docx"]
test-313 = ["py313", "test-core", "test", "ai", "sql", "xarray", "docx"]
test-314 = ["py314", "test-core", "test", "ai", "sql", "xarray", "docx"]
test-core = ["py313", "test-core"]
docs = ["py312", "doc", "ai", "sql"]
build = ["py312", "build"]
lint = ["py312", "lint"]
homepage = ["homepage"]

[dependencies]
bokeh = ">=3.9.0"
holoviews = ">=1.17.0"
httpx = "*"
hvplot = "*"
intake = "<2"
jinja2 = ">3.0"
jsonschema = "*"
lxml = "*"
markdown-it-py = "*"
narwhals = ">=2"
numpy = "*"
packaging = "*"
pandas = "*"
panel = ">=1.9.0"
panel-material-ui = ">=0.14.0"
param = ">=2.2.1,!=2.5.0a0"
pillow = ">=13.0.0"
pip = "*"
platformdirs = "*"
pyyaml = "*"
requests = "*"
sqlglot = "*"
tornado = "*"
tqdm = "*"

[feature.py311.dependencies]
python = "3.11.*"

[feature.py312.dependencies]
python = "3.12.*"

[feature.py312.activation.env]
COVERAGE_CORE = "sysmon"

[feature.py313.dependencies]
python = "3.13.*"

[feature.py313.activation.env]
COVERAGE_CORE = "sysmon"

[feature.py314.dependencies]
python = "3.14.*"

[feature.py314.activation.env]
COVERAGE_CORE = "sysmon"

[feature.ai.dependencies]
chardet = "*"
duckdb = ">=1.2.0"
griffe = "<2"
instructor = ">=1.14.3"
markitdown = "!=0.1.1"
nbformat = "*"
openai = "*"
pyarrow = "*"
pydantic = ">=2.8.0"
pydantic-extra-types = "*"
semchunk = "*"
tiktoken = "*"
tabulate = "*"
vl-convert-python = "*"
panel-splitjs = ">=0.4.0"
panel-graphic-walker = ">=0.6.4"

[feature.sql.dependencies]
duckdb = "*"
intake-sql = "*"
sqlalchemy = "*"

[feature.docx.dependencies]
python-docx = "*"

[feature.xarray.dependencies]
xarray = "*"
netcdf4 = "*"
zarr = "*"

[feature.xarray.pypi-dependencies]
xarray-sql = ">=0.3.1"

# =============================================
# =================== TESTS ===================
# =============================================
[feature.test-core.dependencies]
psutil = "*"
pytest = "*"
pytest-cov = "*"
pytest-github-actions-annotate-failures = "*"
pytest-rerunfailures = "*"
pytest-xdist = "*"
pytest-asyncio = "*"

[feature.test-core.tasks]
test-unit = 'pytest lumen/tests -n logical --dist loadgroup'

[feature.test.dependencies]
dask-core = "*"
fastparquet = "*"
polars = "*"
pyarrow = "*"
matplotlib-base = ">=3.4" # Ubuntu + Python 3.9 installs old version matplotlib (3.3.2)
msgpack-python = "*"
toolz = "*"

# =============================================
# =================== DOCS ====================
# =============================================
[feature.doc.dependencies]
# Replaced mkdocs with zensical
zensical = "<0.0.17"
mkdocstrings = "*"
mkdocstrings-python = "*"

[feature.doc.tasks]
# Updated tasks to use zensical instead of mkdocs
docs-build = { cmd = 'zensical build --clean', depends-on = ['install'] }
docs-serve = { cmd = 'zensical serve', depends-on = ['install'] }
docs-clean = { cmd = 'rm -rf builtdocs', depends-on = ['install'] }

# =============================================
# ================= HOMEPAGE ==================
# =============================================
[feature.homepage.dependencies]
nodejs = ">=20"
# Python only for the Playwright checks; the site itself is Node.
python = "3.12.*"
pytest = "*"
pytest-asyncio = "*" # the shared pytest config sets asyncio options
pytest-playwright = "*"
pillow = "*" # scripts/showcase.py writes webp

[feature.homepage.tasks]
_homepage-install = { cmd = 'npm ci', cwd = 'homepage', inputs = [
    'homepage/package.json',
    'homepage/package-lock.json',
], outputs = ['homepage/node_modules/.package-lock.json'] }
homepage-serve = { cmd = 'npm run dev', cwd = 'homepage', env = { VITE_DOCS_PATH = 'https://lumen.holoviz.org/en/docs/latest' }, depends-on = ['_homepage-install'], description = "Start the homepage dev server" }
homepage-preview = { cmd = 'npm run preview', cwd = 'homepage', description = "Preview the built homepage" }
homepage-typecheck = { cmd = 'npm run typecheck', cwd = 'homepage', depends-on = ['_homepage-install'], description = "Type check the homepage" }
homepage-build = { cmd = 'npm run build', cwd = 'homepage', depends-on = ['_homepage-install'], description = "Build the homepage" }
homepage-test = { cmd = 'pytest homepage/tests --browser chromium', description = "Run the homepage tests" }
homepage-og-image = { cmd = 'python homepage/scripts/og-image.py', description = "Render the homepage social preview image" }

# =============================================
# ================== BUILD ====================
# =============================================
[feature.build.dependencies]
python-build = "*"
conda-build = "*"

[feature.build.tasks]
build-conda = 'bash scripts/conda/build.sh'
build-pip = 'python -m build .'

# =============================================
# =================== LINT ====================
# =============================================
[feature.lint.dependencies]
pre-commit = "*"
pyright = "*"

[feature.lint.tasks]
lint = 'pre-commit run --all-files'
lint-install = 'pre-commit install'
typecheck = 'pyright'
