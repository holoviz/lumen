          ref: data
        position: [0.0, 44.0]
      total_amount_by_category:
        component: Lumen/sql
        origin: t29c94c22
        config:
          sql: |-
            SELECT
              "category",
              SUM("amount") AS "total_amount"
            FROM "sales"
            WHERE
              TRIM("category") <> '' AND NOT "amount" IS NULL
            GROUP BY
              "category"
            ORDER BY
              "category"
          table: total_amount_by_category
        position: [380.0, 0.0]
    edges:
      - from: data.source
        to: total_amount_by_category.source
