        summary: Added total_amount_by_category. Connected data to total_amount_by_category. Added total_amount_by_category_table.
          Connected total_amount_by_category to total_amount_by_category_table.
    nodes:
      data:
        component: Lumen/source
        origin: t50332e69
        config:
          ref: data
        position: [0.0, 44.0]
      total_amount_by_category:
        component: Lumen/sql
        origin: t79d99639
        config:
          sql: |-
            SELECT
              "category",
              SUM("amount") AS "total_amount"
            FROM sales
            WHERE
              TRIM("category") <> '' AND NOT "amount" IS NULL AND "amount" <> -9999
            GROUP BY
              "category"
            ORDER BY
              "category"
          table: total_amount_by_category
        position: [380.0, 0.0]
      total_amount_by_category_table:
        component: Lumen/table_view
        origin: t79d99639
        config:
          spec:
            formatters:
              total_amount:
                type: number
                decimals: 0
        position: [760.0, 44.0]
    edges:
      - from: data.source
        to: total_amount_by_category.source
      - from: total_amount_by_category.pipeline
        to: total_amount_by_category_table.pipeline
    layout:
