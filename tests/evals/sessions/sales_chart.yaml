        config:
          ref: data
        position: [0.0, 44.0]
      total_amount_by_category:
        component: Lumen/sql
        origin: t0036a846
        config:
          sql: |-
            SELECT
              "category",
              SUM("amount") AS "amount"
            FROM sales
            WHERE
              TRIM("category") <> '' AND NOT "amount" IS NULL
            GROUP BY
              "category"
          table: total_amount_by_category
        position: [380.0, 0.0]
      total_amount_by_category_table:
        component: Lumen/table_view
        origin: t0036a846
        config:
          spec:
            formatters:
              amount:
                type: number
        position: [760.0, 44.0]
