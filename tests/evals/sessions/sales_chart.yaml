      - id: t165b84dc
        actor: agent
        at: '2026-11-22T01:08:03Z'
        run: run-0a9d8689b83a
        summary: Added total_amount_by_category. Connected data to total_amount_by_category.
    nodes:
      data:
        component: Lumen/source
        origin: t28fcc34a
        config:
          ref: data
        position: [0.0, 33.0]
      total_amount_by_category:
        component: Lumen/sql
        origin: t165b84dc
        config:
          sql: |-
            SELECT
              "category",
              SUM("amount") AS "total_amount"
            FROM sales
            WHERE
              NOT "category" IS NULL AND TRIM("category") <> '' AND NOT "amount" IS NULL
            GROUP BY
              "category"
            ORDER BY
              "category"
          table: total_amount_by_category
        position: [380.0, 0.0]
    edges:
      - from: data.source
        to: total_amount_by_category.source
    layout:
      tiles:
        - node: data
          visible: false
        - node: total_amount_by_category
          visible: false
