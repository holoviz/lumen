lumen_session: 1
fixture: sales
turns:
- question: What is the total amount by category?
  nodes:
  - total_amount_by_category
  dashboard: |
    flowdash: 2
    title: Untitled
    settings:
      description: ''
      refresh_period: 0.0
      controls_position: top
      header_layout: compact
      node_previews: false
      tile_cards: true
      tile_titles: false
      viewers_can_inspect: false
    turns:
      - id: t01f6d567
        actor: user
