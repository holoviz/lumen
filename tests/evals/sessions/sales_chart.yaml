fixture: sales
turns:
- question: What is the total amount by category?
  nodes:
  - total_amount_by_category
  dashboard: |
    flowdash: 1
    title: Untitled
    settings:
      description: ''
      refresh_period: 0.0
      controls_position: top
      header_layout: compact
      node_previews: false
      tile_cards: true
      tile_titles: false
      viewers_can_inspect: false
    turns:
      - id: t0681091b
        actor: user
        at: '2026-11-23T08:20:21Z'
        summary: Added data.
      - id: tee3d7730
        actor: agent
        at: '2026-11-23T08:20:25Z'
        run: run-58a7049e46a2
        summary: Added total_amount_by_category. Connected data to total_amount_by_category.
    nodes:
      data:
        component: Lumen/source
        origin: t0681091b
        config:
          ref: data
        position: [0.0, 44.0]
      total_amount_by_category:
        component: Lumen/sql
        origin: tee3d7730
        config:
          sql: |-
            SELECT
              "category",
              SUM("amount") AS "total_amount"
            FROM sales
            WHERE
              NOT "category" IS NULL
              AND TRIM("category") <> ''
              AND NOT "amount" IS NULL
              AND "amount" <> -9999
            GROUP BY
              "category"
            ORDER BY
              "category"
          table: total_amount_by_category
        position: [380.0, 0.0]
    edges:
      - from: data.source
        to: total_amount_by_category.source
    layout:
      tiles:
        - node: data
          visible: false
        - node: total_amount_by_category
          visible: false
