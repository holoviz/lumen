turns:
- question: What is the total amount by category?
  nodes:
  - total_amount_by_category
  dashboard: |
    flowdash: 1
    title: Untitled
    settings:
      description: ''
      refresh_period: 0.0
      controls_position: top
      header_layout: compact
      node_previews: false
      tile_cards: true
      tile_titles: false
      viewers_can_inspect: false
    turns:
      - id: t9e41b449
        actor: user
        at: '2026-11-22T12:11:42Z'
        summary: Added data.
      - id: t9925ba14
        actor: agent
        at: '2026-11-22T12:11:45Z'
        run: run-e33d78e3f8d1
        summary: Added total_amount_by_category. Connected data to total_amount_by_category.
    nodes:
      data:
        component: Lumen/source
        origin: t9e41b449
        config:
          ref: data
        position: [0.0, 22.0]
      total_amount_by_category:
        component: Lumen/sql
        origin: t9925ba14
        config:
          sql: |-
            SELECT
              "category",
              SUM("amount") AS "total_amount"
            FROM sales
            WHERE
              NOT "category" IS NULL
              AND TRIM("category") <> ''
              AND NOT "amount" IS NULL
              AND "amount" <> -9999
            GROUP BY
              "category"
          table: total_amount_by_category
        position: [380.0, 0.0]
    edges:
      - from: data.source
        to: total_amount_by_category.source
    layout:
      tiles:
        - node: data
          visible: false
        - node: total_amount_by_category
          visible: false
