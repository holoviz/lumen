lumen_session: 1
fixture: turbines
turns:
- question: Map the turbines, sized by capacity.
  nodes:
  - turbine_locations_capacity
  - turbines_capacity_map
  dashboard: |
    flowdash: 1
    title: Untitled
    settings:
      description: ''
      refresh_period: 0.0
      controls_position: top
      header_layout: compact
      node_previews: false
      tile_cards: true
      tile_titles: false
      viewers_can_inspect: false
    turns:
      - id: t425af00e
        actor: user
        at: '2026-11-22T23:48:36Z'
        summary: Added data.
      - id: t9b5b4de0
        actor: agent
        at: '2026-11-22T23:48:40Z'
        run: run-fec9772e3882
        summary: Added turbine_locations_capacity. Connected data to turbine_locations_capacity. Added turbines_capacity_map.
          Connected turbine_locations_capacity to turbines_capacity_map.
    nodes:
      data:
        component: Lumen/source
        origin: t425af00e
        config:
          ref: data
        position: [0.0, 44.0]
      turbine_locations_capacity:
        component: Lumen/sql
        origin: t9b5b4de0
        config:
          sql: |-
            SELECT
              "p_name",
              "t_state",
              "xlong",
              "ylat",
              "t_cap"
            FROM turbines
            WHERE
              NOT "xlong" IS NULL AND NOT "ylat" IS NULL AND NOT "t_cap" IS NULL
          table: turbine_locations_capacity
        position: [380.0, 0.0]
      turbines_capacity_map:
        component: Lumen/deckgl
        origin: t9b5b4de0
        config:
          spec:
            layers:
              - '@@type': ScatterplotLayer
                getPosition: '@@=[xlong, ylat]'
                radiusUnits: pixels
                getRadius: '@@=2 + t_cap / 200'
                pickable: true
            tooltip:
              text: '{p_name} ({t_state}) — capacity: {t_cap}'
        position: [760.0, 44.0]
    edges:
      - from: data.source
        to: turbine_locations_capacity.source
      - from: turbine_locations_capacity.pipeline
        to: turbines_capacity_map.pipeline
    layout:
      tiles:
        - node: turbines_capacity_map
          width: 100.0
          height: 420
        - node: data
          visible: false
        - node: turbine_locations_capacity
          visible: false
