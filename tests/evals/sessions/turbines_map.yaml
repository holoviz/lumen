lumen_session: 1
fixture: turbines
turns:
- question: Map the turbines, sized by capacity.
  nodes:
  - turbines
  - turbine_capacity_map
  dashboard: |
    flowdash: 1
    title: Untitled
    settings:
      description: ''
      refresh_period: 0.0
      controls_position: top
      header_layout: compact
      node_previews: false
      tile_cards: true
      tile_titles: false
      viewers_can_inspect: false
    turns:
      - id: t8ae9a634
        actor: user
        at: '2026-11-24T23:42:51Z'
        summary: Added data.
      - id: td7fe7bd8
        actor: agent
        at: '2026-11-24T23:42:53Z'
        run: run-f92f9fed2b5a
        summary: Added turbines. Connected data to turbines. Added turbine_capacity_map. Connected turbines
          to turbine_capacity_map.
    nodes:
      data:
        component: Lumen/source
        origin: t8ae9a634
        config:
          ref: data
        position: [0.0, 44.0]
      turbines:
        component: Lumen/sql
        origin: td7fe7bd8
        config:
          sql: |-
            SELECT
              "p_name",
              "t_state",
              "xlong",
              "ylat",
              "t_cap"
            FROM turbines
            WHERE
              NOT "p_name" IS NULL
              AND TRIM("p_name") <> ''
              AND NOT "xlong" IS NULL
              AND NOT "ylat" IS NULL
              AND NOT "t_cap" IS NULL
          table: turbines
        position: [380.0, 0.0]
      turbine_capacity_map:
        component: Lumen/deckgl
        origin: td7fe7bd8
        config:
          spec:
            layers:
              - '@@type': ScatterplotLayer
                getPosition: '@@=[xlong, ylat]'
                radiusUnits: pixels
                getRadius: '@@=2 + t_cap / 200'
                pickable: true
            tooltip:
              text: '{p_name} ({t_state}): {t_cap}'
        position: [760.0, 44.0]
    edges:
      - from: data.source
        to: turbines.source
      - from: turbines.pipeline
        to: turbine_capacity_map.pipeline
    layout:
      tiles:
        - node: turbine_capacity_map
          width: 100.0
          height: 420
        - node: data
          visible: false
        - node: turbines
          visible: false
