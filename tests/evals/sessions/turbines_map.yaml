lumen_session: 1
fixture: turbines
turns:
- question: Map the turbines, sized by capacity.
  nodes:
  - turbines_by_capacity
  - turbines_capacity_map
  dashboard: |
    flowdash: 1
    title: Untitled
    settings:
      description: ''
      refresh_period: 0.0
      controls_position: top
      header_layout: compact
      node_previews: false
      tile_cards: true
      tile_titles: false
      viewers_can_inspect: false
    turns:
      - id: tf8b349d2
        actor: user
        at: '2026-11-23T08:20:53Z'
        summary: Added data.
      - id: t147ea4b0
        actor: agent
        at: '2026-11-23T08:20:55Z'
        run: run-63480a68a69e
        summary: Added turbines_by_capacity. Connected data to turbines_by_capacity. Added turbines_capacity_map.
          Connected turbines_by_capacity to turbines_capacity_map.
    nodes:
      data:
        component: Lumen/source
        origin: tf8b349d2
        config:
          ref: data
        position: [0.0, 44.0]
      turbines_by_capacity:
        component: Lumen/sql
        origin: t147ea4b0
        config:
          sql: |-
            SELECT
              "p_name",
              "t_state",
              "xlong" AS lon,
              "ylat" AS lat,
              "t_cap"
            FROM turbines
            WHERE
              NOT "xlong" IS NULL AND NOT "ylat" IS NULL AND NOT "t_cap" IS NULL
          table: turbines_by_capacity
        position: [380.0, 0.0]
      turbines_capacity_map:
        component: Lumen/deckgl
        origin: t147ea4b0
        config:
          spec:
            layers:
              - '@@type': ScatterplotLayer
                getPosition: '@@=[lon, lat]'
                radiusUnits: pixels
                getRadius: '@@=2 + t_cap / 200'
                pickable: true
            tooltip:
              text: '{p_name} ({t_state}): {t_cap} MW'
        position: [760.0, 44.0]
    edges:
      - from: data.source
        to: turbines_by_capacity.source
      - from: turbines_by_capacity.pipeline
        to: turbines_capacity_map.pipeline
    layout:
      tiles:
        - node: turbines_capacity_map
          width: 100.0
          height: 420
        - node: data
          visible: false
        - node: turbines_by_capacity
          visible: false
