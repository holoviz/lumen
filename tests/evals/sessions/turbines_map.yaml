lumen_session: 1
fixture: turbines
turns:
- question: Map the turbines, sized by capacity.
  nodes:
  - turbine_locations_capacity
  - turbines_sized_by_capacity
  dashboard: |
    flowdash: 1
    title: Untitled
    settings:
      description: ''
      refresh_period: 0.0
      controls_position: top
      header_layout: compact
      node_previews: false
      tile_cards: true
      tile_titles: false
      viewers_can_inspect: false
    turns:
      - id: t19cbded2
        actor: user
        at: '2026-11-23T09:09:01Z'
        summary: Added data.
      - id: tdbeb0d58
        actor: agent
        at: '2026-11-23T09:09:04Z'
        run: run-86ce1d0501d6
        summary: Added turbine_locations_capacity. Connected data to turbine_locations_capacity. Added turbines_sized_by_capacity.
          Connected turbine_locations_capacity to turbines_sized_by_capacity.
    nodes:
      data:
        component: Lumen/source
        origin: t19cbded2
        config:
          ref: data
        position: [0.0, 44.0]
      turbine_locations_capacity:
        component: Lumen/sql
        origin: tdbeb0d58
        config:
          sql: |-
            SELECT
              "p_name",
              "t_state",
              "xlong",
              "ylat",
              "t_cap"
            FROM turbines
            WHERE
              NOT "xlong" IS NULL AND NOT "ylat" IS NULL AND NOT "t_cap" IS NULL
          table: turbine_locations_capacity
        position: [380.0, 0.0]
      turbines_sized_by_capacity:
        component: Lumen/deckgl
        origin: tdbeb0d58
        config:
          spec:
            layers:
              - '@@type': ScatterplotLayer
                getPosition: '@@=[xlong, ylat]'
                radiusUnits: pixels
                getRadius: '@@=2 + t_cap / 200'
                pickable: true
            tooltip:
              text: '{p_name} ({t_state}): {t_cap} capacity'
        position: [760.0, 44.0]
    edges:
      - from: data.source
        to: turbine_locations_capacity.source
      - from: turbine_locations_capacity.pipeline
        to: turbines_sized_by_capacity.pipeline
    layout:
      tiles:
        - node: turbines_sized_by_capacity
          width: 100.0
          height: 420
        - node: data
          visible: false
        - node: turbine_locations_capacity
          visible: false
