lumen_session: 1
fixture: turbines
turns:
- question: Map the turbines, sized by capacity.
  nodes:
  - turbines_capacity_map_data
  - turbines_by_capacity_map
  dashboard: |
    flowdash: 1
    title: Untitled
    settings:
      description: ''
      refresh_period: 0.0
      controls_position: top
      header_layout: compact
      node_previews: false
      tile_cards: true
      tile_titles: false
      viewers_can_inspect: false
    turns:
      - id: t77404287
        actor: user
        at: '2026-11-25T00:53:10Z'
        summary: Added data.
      - id: t9cd07b7c
        actor: agent
        at: '2026-11-25T00:53:13Z'
        run: run-48a5a92430a0
        summary: Added turbines_capacity_map_data. Connected data to turbines_capacity_map_data. Added turbines_by_capacity_map.
          Connected turbines_capacity_map_data to turbines_by_capacity_map.
    nodes:
      data:
        component: Lumen/source
        origin: t77404287
        config:
          ref: data
        position: [0.0, 44.0]
      turbines_capacity_map_data:
        component: Lumen/sql
        origin: t9cd07b7c
        config:
          sql: |-
            SELECT
              "p_name",
              "t_state",
              "xlong" AS lon,
              "ylat" AS lat,
              "t_cap"
            FROM turbines
            WHERE
              NOT "p_name" IS NULL
              AND TRIM("p_name") <> ''
              AND NOT "t_state" IS NULL
              AND TRIM("t_state") <> ''
              AND NOT "xlong" IS NULL
              AND NOT "ylat" IS NULL
              AND NOT "t_cap" IS NULL
              AND "t_cap" <> -9999
          table: turbines_capacity_map_data
        position: [380.0, 0.0]
      turbines_by_capacity_map:
        component: Lumen/deckgl
        origin: t9cd07b7c
        config:
          spec:
            layers:
              - '@@type': ScatterplotLayer
                getPosition: '@@=[lon, lat]'
                radiusUnits: pixels
                getRadius: '@@=2 + t_cap / 200'
                pickable: true
            tooltip:
              text: '{p_name} ({t_state}): {t_cap} capacity'
        position: [760.0, 44.0]
    edges:
      - from: data.source
        to: turbines_capacity_map_data.source
      - from: turbines_capacity_map_data.pipeline
        to: turbines_by_capacity_map.pipeline
    layout:
      tiles:
        - node: turbines_by_capacity_map
          width: 100.0
          height: 420
        - node: data
          visible: false
        - node: turbines_capacity_map_data
          visible: false
