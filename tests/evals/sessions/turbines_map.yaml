lumen_session: 1
fixture: turbines
turns:
- question: Map the turbines, sized by capacity.
  nodes:
  - turbine_locations_capacity
  - turbines_by_capacity_map
  dashboard: |
    flowdash: 1
    title: Untitled
    settings:
      description: ''
      refresh_period: 0.0
      controls_position: top
      header_layout: compact
      node_previews: false
      tile_cards: true
      tile_titles: false
      viewers_can_inspect: false
    turns:
      - id: t2b863951
        actor: user
        at: '2026-11-23T10:13:57Z'
        summary: Added data.
      - id: t19bc2550
        actor: agent
        at: '2026-11-23T10:14:00Z'
        run: run-33a9598d54d7
        summary: Added turbine_locations_capacity. Connected data to turbine_locations_capacity. Added turbines_by_capacity_map.
          Connected turbine_locations_capacity to turbines_by_capacity_map.
    nodes:
      data:
        component: Lumen/source
        origin: t2b863951
        config:
          ref: data
        position: [0.0, 44.0]
      turbine_locations_capacity:
        component: Lumen/sql
        origin: t19bc2550
        config:
          sql: |-
            SELECT
              "p_name",
              "t_state",
              "xlong" AS lon,
              "ylat" AS lat,
              "t_cap"
            FROM turbines
            WHERE
              NOT "p_name" IS NULL
              AND TRIM("p_name") <> ''
              AND NOT "t_state" IS NULL
              AND TRIM("t_state") <> ''
              AND NOT "xlong" IS NULL
              AND NOT "ylat" IS NULL
              AND NOT "t_cap" IS NULL
              AND "t_cap" <> -9999
          table: turbine_locations_capacity
        position: [380.0, 0.0]
      turbines_by_capacity_map:
        component: Lumen/deckgl
        origin: t19bc2550
        config:
          spec:
            layers:
              - '@@type': ScatterplotLayer
                getPosition: '@@=[lon, lat]'
                radiusUnits: pixels
                getRadius: '@@=2 + t_cap / 200'
                pickable: true
            tooltip:
              text: '{p_name} ({t_state}) — capacity: {t_cap}'
        position: [760.0, 44.0]
    edges:
      - from: data.source
        to: turbine_locations_capacity.source
      - from: turbine_locations_capacity.pipeline
        to: turbines_by_capacity_map.pipeline
    layout:
      tiles:
        - node: turbines_by_capacity_map
          width: 100.0
          height: 420
        - node: data
          visible: false
        - node: turbine_locations_capacity
          visible: false
