lumen_session: 1
fixture: turbines
turns:
- question: Map the turbines, sized by capacity.
  nodes:
  - turbine_locations
  - turbines_by_capacity
  dashboard: |
    flowdash: 1
    title: Untitled
    settings:
      description: ''
      refresh_period: 0.0
      controls_position: top
      header_layout: compact
      node_previews: false
      tile_cards: true
      tile_titles: false
      viewers_can_inspect: false
    turns:
      - id: t23723afb
        actor: user
        at: '2026-11-24T01:58:24Z'
        summary: Added data.
      - id: t440f1049
        actor: agent
        at: '2026-11-24T01:58:26Z'
        run: run-7633c68ecacc
        summary: Added turbine_locations. Connected data to turbine_locations. Added turbines_by_capacity.
          Connected turbine_locations to turbines_by_capacity.
    nodes:
      data:
        component: Lumen/source
        origin: t23723afb
        config:
          ref: data
        position: [0.0, 44.0]
      turbine_locations:
        component: Lumen/sql
        origin: t440f1049
        config:
          sql: |-
            SELECT
              "p_name",
              "t_state",
              "xlong" AS lon,
              "ylat" AS lat,
              "t_cap" AS capacity_mw
            FROM turbines
            WHERE
              NOT "xlong" IS NULL AND NOT "ylat" IS NULL AND NOT "t_cap" IS NULL
          table: turbine_locations
        position: [380.0, 0.0]
      turbines_by_capacity:
        component: Lumen/deckgl
        origin: t440f1049
        config:
          spec:
            layers:
              - '@@type': ScatterplotLayer
                getPosition: '@@=[lon, lat]'
                radiusUnits: pixels
                getRadius: '@@=2 + capacity_mw / 200'
                pickable: true
            tooltip:
              text: '{p_name} ({t_state}): {capacity_mw} MW'
        position: [760.0, 44.0]
    edges:
      - from: data.source
        to: turbine_locations.source
      - from: turbine_locations.pipeline
        to: turbines_by_capacity.pipeline
    layout:
      tiles:
        - node: turbines_by_capacity
          width: 100.0
          height: 420
        - node: data
          visible: false
        - node: turbine_locations
          visible: false
