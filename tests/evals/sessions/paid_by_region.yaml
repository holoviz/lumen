lumen_session: 1
fixture: commerce
turns:
- question: What is the total paid order amount per region?
  nodes:
  - paid_order_amount_by_region
  - paid_order_amount_by_region_table
  dashboard: |
    flowdash: 1
    title: Untitled
    settings:
      description: ''
      refresh_period: 0.0
      controls_position: top
      header_layout: compact
      node_previews: false
      tile_cards: true
      tile_titles: false
      viewers_can_inspect: false
    turns:
      - id: tc0c8e861
        actor: user
        at: '2026-11-24T03:56:21Z'
        summary: Added data.
      - id: t045a8be7
        actor: agent
        at: '2026-11-24T03:56:27Z'
        run: run-3b085228ad81
        summary: Added paid_order_amount_by_region. Connected data to paid_order_amount_by_region. Added paid_order_amount_by_region_table.
          Connected paid_order_amount_by_region to paid_order_amount_by_region_table.
    nodes:
      data:
        component: Lumen/source
        origin: tc0c8e861
        config:
          ref: data
        position: [0.0, 44.0]
      paid_order_amount_by_region:
        component: Lumen/sql
        origin: t045a8be7
        config:
          sql: |-
            SELECT
              c."region",
              SUM(o."amount") AS total_paid_order_amount
            FROM orders AS o
            JOIN customers AS c
              ON o."customer_id" = c."customer_id"
            WHERE
              o."status" = 'paid'
            GROUP BY
              c."region"
          table: paid_order_amount_by_region
        position: [380.0, 0.0]
      paid_order_amount_by_region_table:
        component: Lumen/table_view
        origin: t045a8be7
        config:
          spec:
            formatters:
              total_paid_order_amount:
                type: money
                symbol: $
                decimals: 0
        position: [760.0, 44.0]
    edges:
      - from: data.source
        to: paid_order_amount_by_region.source
      - from: paid_order_amount_by_region.pipeline
        to: paid_order_amount_by_region_table.pipeline
    layout:
      tiles:
        - node: paid_order_amount_by_region_table
          width: 100.0
          height: 400
        - node: data
          visible: false
        - node: paid_order_amount_by_region
