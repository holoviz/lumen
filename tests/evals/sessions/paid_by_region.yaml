      - id: t5f17b7e4
        actor: agent
        at: '2026-11-22T00:33:27Z'
        run: run-d03491c121e9
        summary: Added paid_order_amount_by_region. Connected data to paid_order_amount_by_region.
    nodes:
      data:
        component: Lumen/source
        origin: t863181f5
        config:
          ref: data
        position: [0.0, 33.0]
      paid_order_amount_by_region:
        component: Lumen/sql
        origin: t5f17b7e4
        config:
          sql: |-
            SELECT
              c."region",
              SUM(o."amount") AS "total_paid_order_amount"
            FROM orders AS o
            JOIN customers AS c
              ON o."customer_id" = c."customer_id"
            WHERE
              o."status" = 'paid'
              AND NOT o."amount" IS NULL
              AND NOT c."region" IS NULL
              AND TRIM(c."region") <> ''
            GROUP BY
              c."region"
            ORDER BY
              c."region"
          table: paid_order_amount_by_region
        position: [380.0, 0.0]
    edges:
      - from: data.source
        to: paid_order_amount_by_region.source
    layout:
      tiles:
        - node: data
          visible: false
        - node: paid_order_amount_by_region
          visible: false
