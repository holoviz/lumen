      paid_order_amount_by_region:
        component: Lumen/sql
        origin: t0d763456
        config:
          sql: |-
            SELECT
              c."region",
              SUM(o."amount") AS total_paid_order_amount
            FROM orders AS o
            JOIN customers AS c
              ON o."customer_id" = c."customer_id"
            WHERE
              o."status" = 'paid'
            GROUP BY
              c."region"
            ORDER BY
              c."region"
          table: paid_order_amount_by_region
        position: [380.0, 0.0]
