- question: What is the total paid order amount per region?
  nodes:
  - paid_order_amount_by_region
  dashboard: |
    flowdash: 2
    title: Untitled
    settings:
      description: ''
      refresh_period: 0.0
      controls_position: top
      header_layout: compact
      node_previews: false
      tile_cards: true
      tile_titles: false
      viewers_can_inspect: false
    turns:
      - id: t8b41355b
        actor: user
        at: '2026-11-18T22:31:17Z'
        summary: Added data.
      - id: t784dce1e
        actor: agent
        at: '2026-11-18T22:31:23Z'
        run: run-26d55c085105
        summary: Added paid_order_amount_by_region. Connected data to paid_order_amount_by_region.
    nodes:
      data:
        component: Lumen/source
        origin: t8b41355b
        config:
          ref: data
        position: [0, 0]
      paid_order_amount_by_region:
        component: Lumen/sql
        origin: t784dce1e
        config:
          sql: |-
            SELECT
              c."region",
              SUM(o."amount") AS total_paid_order_amount
            FROM orders AS o
            JOIN customers AS c
              ON o."customer_id" = c."customer_id"
            WHERE
              o."status" = 'paid' AND NOT c."region" IS NULL AND TRIM(c."region") <> ''
            GROUP BY
              c."region"
          table: paid_order_amount_by_region
        position: [350, 0]
    edges:
      - from: data.source
        to: paid_order_amount_by_region.source
