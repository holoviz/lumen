        at: '2026-11-21T18:59:49Z'
        run: run-e06bc674ac82
        summary: Added paid_amount_by_region. Connected data to paid_amount_by_region.
    nodes:
      data:
        component: Lumen/source
        origin: t6d3dda93
        config:
          ref: data
        position: [0.0, 22.0]
      paid_amount_by_region:
        component: Lumen/sql
        origin: t9cc1548e
        config:
          sql: |-
            SELECT
              c."region",
              SUM(o."amount") AS total_paid_amount
            FROM orders AS o
            JOIN customers AS c
              ON o."customer_id" = c."customer_id"
            WHERE
              o."status" = 'paid'
            GROUP BY
              c."region"
          table: paid_amount_by_region
        position: [380.0, 0.0]
    edges:
      - from: data.source
        to: paid_amount_by_region.source
    layout:
