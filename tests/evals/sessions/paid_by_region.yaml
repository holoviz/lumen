lumen_session: 1
fixture: commerce
turns:
- question: What is the total paid order amount per region?
  nodes:
  - paid_amount_by_region
  dashboard: |
    flowdash: 1
    title: Untitled
    settings:
      description: ''
      refresh_period: 0.0
      controls_position: top
      header_layout: compact
      tile_cards: true
      tile_titles: false
      viewers_can_inspect: false
    nodes:
      data:
        component: Lumen/source
        config:
          ref: data
          spec:
            read_only: false
            tables:
              customers: SELECT * FROM (VALUES (1, 'Ada', 'east'), (2, 'Bo', 'west'), (3, 'Cy', 'east'), (4,
                'Dee', 'north')) AS t(customer_id, customer, region)
              orders: SELECT * FROM (VALUES (101, 1, 30, 'paid'), (102, 1, 20, 'paid'), (103, 2, 40, 'paid'),
                (104, 2, 10, 'cancelled'), (105, 3, 15, 'paid')) AS t(order_id, customer_id, amount, status)
            uri: ':memory:'
            type: duckdb
        position: [0, 0]
      paid_amount_by_region:
        component: Lumen/sql
        config:
          sql: |-
            SELECT
              c.region,
              SUM(o.amount) AS total_paid_order_amount
            FROM orders AS o
            JOIN customers AS c
              ON o.customer_id = c.customer_id
            WHERE
              o.status = 'paid'
            GROUP BY
              c.region
          table: paid_amount_by_region
        position: [350, 0]
    edges:
      - from: data.source
        to: paid_amount_by_region.source
- question: Only keep the west region.
  nodes:
  - paid_amount_by_region
  dashboard: |
    flowdash: 1
    title: Untitled
    settings:
      description: ''
      refresh_period: 0.0
      controls_position: top
      header_layout: compact
      tile_cards: true
      tile_titles: false
      viewers_can_inspect: false
    nodes:
      data:
        component: Lumen/source
        config:
          ref: data
          spec:
            read_only: false
            tables:
              customers: SELECT * FROM (VALUES (1, 'Ada', 'east'), (2, 'Bo', 'west'), (3, 'Cy', 'east'), (4,
                'Dee', 'north')) AS t(customer_id, customer, region)
              orders: SELECT * FROM (VALUES (101, 1, 30, 'paid'), (102, 1, 20, 'paid'), (103, 2, 40, 'paid'),
                (104, 2, 10, 'cancelled'), (105, 3, 15, 'paid')) AS t(order_id, customer_id, amount, status)
            uri: ':memory:'
            type: duckdb
        position: [0, 0]
      paid_amount_by_region:
        component: Lumen/sql
        config:
          sql: |-
            SELECT
              c.region,
              SUM(o.amount) AS total_paid_order_amount
            FROM orders AS o
            JOIN customers AS c
              ON o.customer_id = c.customer_id
            WHERE
              o.status = 'paid'
              AND c.region = 'west'
            GROUP BY
              c.region
          table: paid_amount_by_region
        position: [350, 0]
    edges:
      - from: data.source
        to: paid_amount_by_region.source
