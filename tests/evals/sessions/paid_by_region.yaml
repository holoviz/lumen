        run: run-2965962ef39b
        summary: Added paid_order_amount_per_region. Connected data to paid_order_amount_per_region.
    nodes:
      data:
        component: Lumen/source
        origin: t8c11a4b3
        config:
          ref: data
        position: [0.0, 22.0]
      paid_order_amount_per_region:
        component: Lumen/sql
        origin: tbb423bc7
        config:
          sql: |-
            SELECT
              c."region",
              SUM(o."amount") AS total_paid_order_amount
            FROM orders AS o
            JOIN customers AS c
              ON o."customer_id" = c."customer_id"
            WHERE
              o."status" = 'paid'
            GROUP BY
              c."region"
          table: paid_order_amount_per_region
        position: [380.0, 0.0]
    edges:
      - from: data.source
        to: paid_order_amount_per_region.source
    layout:
      tiles:
