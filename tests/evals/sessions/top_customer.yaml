      paid_orders_by_customer:
        component: Lumen/sql
        origin: t5b333599
        config:
          sql: |-
            SELECT
              c."customer",
              COUNT(*) AS paid_order_count
            FROM orders AS o
            JOIN customers AS c
              ON o."customer_id" = c."customer_id"
            WHERE
              o."status" = 'paid'
            GROUP BY
              c."customer"
            ORDER BY
              paid_order_count DESC
            LIMIT 1
          table: paid_orders_by_customer
        position: [380.0, 0.0]
