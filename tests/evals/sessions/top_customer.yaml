    nodes:
      data:
        component: Lumen/source
        origin: t8caf8212
        config:
          ref: data
        position: [0.0, 44.0]
      top_paid_order_customer:
        component: Lumen/sql
        origin: t2854916c
        config:
          sql: |-
            SELECT
              c."customer",
              COUNT(*) AS paid_order_count
            FROM orders AS o
            JOIN customers AS c
              ON o."customer_id" = c."customer_id"
            WHERE
              o."status" = 'paid'
            GROUP BY
              c."customer"
            ORDER BY
              paid_order_count DESC
            LIMIT 1
          table: top_paid_order_customer
        position: [380.0, 0.0]
      top_paid_customer_table:
        component: Lumen/table_view
        origin: t2854916c
        config:
