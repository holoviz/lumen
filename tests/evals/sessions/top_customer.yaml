      customer_most_paid_orders:
        component: Lumen/sql
        origin: tee6eb8cc
        config:
          sql: |-
            SELECT
              c."customer",
              COUNT(o."order_id") AS paid_order_count
            FROM customers AS c
            JOIN orders AS o
              ON c."customer_id" = o."customer_id"
            WHERE
              o."status" = 'paid' AND TRIM(c."customer") <> '' AND TRIM(o."status") <> ''
            GROUP BY
              c."customer"
            ORDER BY
              paid_order_count DESC
            LIMIT 1
          table: customer_most_paid_orders
        position: [380.0, 0.0]
