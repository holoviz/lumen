    nodes:
      data:
        component: Lumen/source
        origin: td8173dea
        config:
          ref: data
        position: [0.0, 44.0]
      paid_order_count_by_customer:
        component: Lumen/sql
        origin: t8430e244
        config:
          sql: |-
            SELECT
              c."customer",
              COUNT(*) AS paid_order_count
            FROM orders AS o
            JOIN customers AS c
              ON o."customer_id" = c."customer_id"
            WHERE
              o."status" = 'paid'
            GROUP BY
              c."customer"
            ORDER BY
              paid_order_count DESC
            LIMIT 1
          table: paid_order_count_by_customer
        position: [380.0, 0.0]
      top_customer_paid_order_count:
        component: Lumen/table_view
        origin: t8430e244
        config:
          spec:
            page_size: 1
            formatters:
              paid_order_count: number
        position: [760.0, 44.0]
