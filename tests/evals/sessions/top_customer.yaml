lumen_session: 1
fixture: commerce
turns:
- question: Which customer has the most paid orders? Show only that customer and the count.
  nodes:
  - top_paid_customer
  dashboard: |
    flowdash: 1
    title: Untitled
    settings:
      description: ''
      refresh_period: 0.0
      controls_position: top
      header_layout: compact
      tile_cards: true
      tile_titles: false
      viewers_can_inspect: false
    nodes:
      data:
        component: Lumen/source
        config:
          ref: data
        position: [0, 0]
      top_paid_customer:
        component: Lumen/sql
        config:
          sql: |-
            SELECT
              c.customer,
              COUNT(o.order_id) AS paid_orders
            FROM orders AS o
            JOIN customers AS c
              ON c.customer_id = o.customer_id
            WHERE
              o.status = 'paid'
            GROUP BY
              c.customer
            QUALIFY
              ROW_NUMBER() OVER (ORDER BY COUNT(o.order_id) DESC, c.customer ASC) = 1
          table: top_paid_customer
        position: [350, 0]
    edges:
      - from: data.source
        to: top_paid_customer.source
