      customer_with_most_paid_orders:
        component: Lumen/sql
        origin: td2c8c333
        config:
          sql: |-
            SELECT
              c."customer",
              COUNT(*) AS paid_order_count
            FROM orders AS o
            JOIN customers AS c
              ON o."customer_id" = c."customer_id"
            WHERE
              o."status" = 'paid'
            GROUP BY
              c."customer"
            ORDER BY
              paid_order_count DESC
            LIMIT 1
          table: customer_with_most_paid_orders
        position: [360.0, 0.0]
