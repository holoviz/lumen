lumen_session: 1
fixture: commerce
turns:
- question: Which customer has the most paid orders? Show only that customer and the count.
  nodes:
  - paid_orders_by_customer
  - top_customer_paid_orders
  dashboard: |
    flowdash: 1
    title: Untitled
    settings:
      description: ''
      refresh_period: 0.0
      controls_position: top
      header_layout: compact
      node_previews: false
      tile_cards: true
      tile_titles: false
      viewers_can_inspect: false
    turns:
      - id: t3d6df9ec
        actor: user
        at: '2026-11-24T01:58:12Z'
        summary: Added data.
      - id: t0bca86bb
        actor: agent
        at: '2026-11-24T01:58:17Z'
        run: run-ae9e6fd02e2b
        summary: Added paid_orders_by_customer. Connected data to paid_orders_by_customer. Added top_customer_paid_orders.
          Connected paid_orders_by_customer to top_customer_paid_orders.
    nodes:
      data:
        component: Lumen/source
        origin: t3d6df9ec
        config:
          ref: data
        position: [0.0, 44.0]
      paid_orders_by_customer:
        component: Lumen/sql
        origin: t0bca86bb
        config:
          sql: |-
            SELECT
              c."customer",
              COUNT(*) AS paid_order_count
            FROM orders AS o
            JOIN customers AS c
              ON o."customer_id" = c."customer_id"
            WHERE
              o."status" = 'paid'
            GROUP BY
              c."customer"
            ORDER BY
              paid_order_count DESC
            LIMIT 1
          table: paid_orders_by_customer
        position: [380.0, 0.0]
      top_customer_paid_orders:
        component: Lumen/table_view
        origin: t0bca86bb
        config:
          spec:
            page_size: 10
            formatters:
              paid_order_count:
                type: number
        position: [760.0, 44.0]
    edges:
      - from: data.source
        to: paid_orders_by_customer.source
      - from: paid_orders_by_customer.pipeline
        to: top_customer_paid_orders.pipeline
    layout:
      tiles:
        - node: top_customer_paid_orders
          width: 100.0
          height: 400
        - node: data
          visible: false
        - node: paid_orders_by_customer
          visible: false
