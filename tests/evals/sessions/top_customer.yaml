      top_customer_paid_orders:
        component: Lumen/sql
        origin: t94c6a56f
        config:
          sql: |-
            SELECT
              customers."customer",
              COUNT(orders."order_id") AS paid_order_count
            FROM customers
            JOIN orders
              ON customers."customer_id" = orders."customer_id"
            WHERE
              orders."status" = 'paid' AND TRIM(customers."customer") <> ''
            GROUP BY
              customers."customer"
            ORDER BY
              paid_order_count DESC
            LIMIT 1
          table: top_customer_paid_orders
        position: [350, 0]
    edges:
      - from: data.source
