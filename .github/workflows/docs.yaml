name: docs

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+a[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+b[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+rc[0-9]+"
  workflow_dispatch:
    inputs:
      target:
        description: "Site to build and deploy"
        type: choice
        options:
          - dev
          - main
          - dryrun
        required: true
        default: dryrun
  schedule:
    - cron: "0 17 * * SUN"

defaults:
  run:
    shell: bash -e {0}

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Prerelease tags and dev dispatches publish to the lumen-dev.holoviz.org staging site.
  DEV_DEPLOY: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'dev') || (github.event_name == 'push' && (contains(github.ref_name, 'a') || contains(github.ref_name, 'b') || contains(github.ref_name, 'rc'))) }}

jobs:
  pixi_lock:
    name: Pixi lock
    runs-on: ubuntu-latest
    steps:
      - uses: holoviz-dev/holoviz_tasks/pixi-lock@11eb638302f76ec64217e2eeddfb11df1f788b54 # v1.0.2

  docs_build:
    name: Build Documentation
    needs: [pixi_lock]
    runs-on: "macos-latest"
    timeout-minutes: 180
    steps:
      - uses: holoviz-dev/holoviz_tasks/pixi-install@11eb638302f76ec64217e2eeddfb11df1f788b54 # v1.0.2
        with:
          environments: docs
      # site_url sets the canonical links, the sitemap and the absolute asset paths in the
      # root 404.html, so the staging build has to point at its own /en/docs/dev/.
      - name: Target the lumen-dev staging site
        if: env.DEV_DEPLOY == 'true'
        run: |
          sed -i '' 's#^site_url = .*#site_url = "https://lumen-dev.holoviz.org/en/docs/dev/"#' zensical.toml
          grep -q '^site_url = "https://lumen-dev.holoviz.org/en/docs/dev/"$' zensical.toml
      - name: Build documentation
        run: pixi run -e docs docs-build
      # The staging distribution sends X-Robots-Tag: noindex on every response, which
      # crawlers only see on pages robots.txt lets them fetch, so staging allows them all.
      - name: Let crawlers see the staging site's noindex header
        if: env.DEV_DEPLOY == 'true'
        run: |
          printf 'User-agent: *\nAllow: /\n' > builtdocs/robots.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: docs
          if-no-files-found: error
          path: builtdocs

  docs_publish:
    name: Publish Documentation
    # The weekly scheduled build only checks that the docs still build.
    if: github.event_name != 'schedule'
    runs-on: "ubuntu-latest"
    needs: [docs_build]
    env:
      MAIN_DISPATCH: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'main' }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docs
          path: builtdocs/
      - name: Select the target site
        env:
          CLOUDFRONT_ID_MAIN: ${{ vars.CLOUDFRONT_ID_MAIN }}
          CLOUDFRONT_ID_DEV: ${{ vars.CLOUDFRONT_ID_DEV }}
        run: |
          if [ "$DEV_DEPLOY" = "true" ]; then
            {
              echo "BUCKET=lumen-dev.holoviz.org"
              echo "CLOUDFRONT_ID=$CLOUDFRONT_ID_DEV"
              echo "DOCS_VERSION=dev"
            } >> "$GITHUB_ENV"
          else
            # A manual main deploy publishes under the version in the ref name, so it has to
            # be dispatched from a release tag.
            if [ "$MAIN_DISPATCH" = "true" ] && [ "$GITHUB_REF_TYPE" != "tag" ]; then
              echo "::error::Dispatch the main target from a release tag, e.g. --ref v1.4.0"
              exit 1
            fi
            {
              echo "BUCKET=lumen.holoviz.org"
              echo "CLOUDFRONT_ID=$CLOUDFRONT_ID_MAIN"
              echo "DOCS_VERSION=${GITHUB_REF_NAME#v}"
            } >> "$GITHUB_ENV"
          fi
      # Zensical's 404.html is the root 404 page: the homepage does not build one.
      - name: Deploy
        uses: holoviz-dev/holoviz_tasks/docs-publish@17107a157b32cc1bd2a09c71fbdbc74603efdb40 # v1.0.15
        with:
          s3-url: s3://${{ env.BUCKET }}
          s3-cloudfront-id: ${{ env.CLOUDFRONT_ID }}
          s3-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          s3-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          version: ${{ env.DOCS_VERSION }}
          switcher-path: ./builtdocs/switcher.json
          sitemap-path: ./builtdocs/sitemap.xml
          robots-path: ./builtdocs/robots.txt
          error-404-path: ./builtdocs/404.html
